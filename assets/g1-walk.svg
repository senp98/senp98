<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img"
     aria-labelledby="t d">
  <title id="t">A humanoid robot walking across an RViz grid</title>
  <desc id="d">A G1-style humanoid walks across a grey 3D grid, falls flat on its face halfway, springs back up and keeps walking.</desc>
  <style>
  .walk { transform: translateX(560px); }
  .thigh, .shin, .arm, .bob, .lean { transform-origin: 0 0; }
  .lean { transform: rotate(4deg); }
  .pose { transform-origin: 6px 66px; }
  @media (prefers-reduced-motion: no-preference) {
    .walk { animation: walk 15.0s linear 0.0s infinite; }
    .pose { animation: fall 15.0s 0.0s infinite; }
    .bob  { animation: bob 0.225s ease-in-out 0.0s infinite alternate; }
    .thigh.a { animation: thigh 0.9s ease-in-out 0.0s infinite; }
    .thigh.b { animation: thigh 0.9s ease-in-out -0.45s infinite; }
    .shin.a  { animation: shin 0.9s ease-in-out 0.0s infinite; }
    .shin.b  { animation: shin 0.9s ease-in-out -0.45s infinite; }
    .arm.a   { animation: arm 0.9s ease-in-out 0.0s infinite; }
    .arm.b   { animation: arm 0.9s ease-in-out -0.45s infinite; }
  }
  @keyframes walk {
    0%   { transform: translateX(-80px); }
    45%  { transform: translateX(440px); }
    47%  { transform: translateX(452px); }
    63%  { transform: translateX(452px); }
    100% { transform: translateX(980px); }
  }
  @keyframes fall {
    0%, 45% { transform: rotate(0deg); animation-timing-function: ease-out; }
    46.5% { transform: rotate(16deg); animation-timing-function: ease-in; }
    49%   { transform: rotate(84deg); animation-timing-function: ease-out; }
    50%   { transform: rotate(76deg); animation-timing-function: ease-in; }
    51%   { transform: rotate(84deg); }
    58%   { transform: rotate(84deg); animation-timing-function: cubic-bezier(.5,-0.4,.6,1.4); }
    62.5% { transform: rotate(0deg); }
    100%  { transform: rotate(0deg); }
  }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2px); } }
  @keyframes thigh {
    0%   { transform: rotate(-22deg); }
    50%  { transform: rotate(16deg); }
    100% { transform: rotate(-22deg); }
  }
  @keyframes shin {
    0%, 40% { transform: rotate(4deg); }
    68%     { transform: rotate(55deg); }
    100%    { transform: rotate(4deg); }
  }
  @keyframes arm {
    0%   { transform: rotate(-16deg); }
    50%  { transform: rotate(20deg); }
    100% { transform: rotate(-16deg); }
  }
  </style>
  <defs>
    <clipPath id="frame"><rect width="900" height="200" rx="12"/></clipPath>
    <linearGradient id="fade" x1="0" y1="50" x2="0" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="floor"><rect width="900" height="200" fill="url(#fade)"/></mask>
