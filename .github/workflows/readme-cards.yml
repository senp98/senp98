# Generates the GitHub stats card (light + dark) into profile/ and commits it,
# so the README does not depend on the public github-readme-stats Vercel
# instance (which has been returning 503s).
#
# Optional: add a classic PAT (scopes: repo, read:user) as repository secret
# STATS_TOKEN to include private-repo contributions; otherwise only public
# data is counted via the built-in GITHUB_TOKEN.

name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&hide_border=true&hide_rank=true&hide=prs&include_all_commits=true'
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&hide_border=true&hide_rank=true&hide=prs&include_all_commits=true&theme=github_dark'
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
